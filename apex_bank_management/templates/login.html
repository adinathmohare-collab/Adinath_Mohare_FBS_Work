{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Account Login</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Account ID</label>
                        <input type="number" name="account_id" class="form-control" placeholder="Enter Account ID" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">4-Digit PIN</label>
                        <input type="password" name="pin" maxlength="4" class="form-control" placeholder="Enter PIN" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
            <div class="card-footer text-center">
                Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

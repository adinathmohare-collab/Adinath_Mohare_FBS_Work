{% extends "base.html" %}

{% block content %}
<div class="row">
    <!-- Left Navigation Sidebar -->
    <div class="col-md-3 mb-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-semibold">Navigation</h5>
            </div>
            <div class="list-group list-group-flush">
                <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action py-3">
                    📊 Dashboard
                </a>
                <a href="{{ url_for('deposit') }}" class="list-group-item list-group-item-action py-3">
                    💰 Deposit
                </a>
                <a href="{{ url_for('withdraw') }}" class="list-group-item list-group-item-action py-3">
                    💸 Withdraw
                </a>
                <a href="{{ url_for('transfer') }}" class="list-group-item list-group-item-action active fw-bold py-3">
                    🔄 Transfer
                </a>
                <a href="{{ url_for('transactions') }}" class="list-group-item list-group-item-action py-3">
                    📜 Transaction History
                </a>
                <a href="{{ url_for('change_pin') }}" class="list-group-item list-group-item-action py-3">
                    🔑 Change PIN
                </a>
            </div>
        </div>
    </div>

    <!-- Main Transfer Form Area -->
    <div class="col-md-9">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold">Transfer Money</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('transfer') }}" method="POST" autocomplete="off">
                    
                    <!-- Receiver Account ID -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Recipient Account ID</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light text-muted">👤</span>
                            <input type="text" name="receiver_id" class="form-control" placeholder="Enter recipient Account ID" required>
                        </div>
                        <div class="form-text">Ensure the Account ID is correct before proceeding.</div>
                    </div>

                    <!-- Transfer Amount -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Amount (₹)</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light text-muted">₹</span>
                            <input type="number" step="0.01" name="amount" class="form-control" placeholder="1000.00" min="1" required>
                        </div>
                    </div>

                    <!-- Security PIN -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Enter Security PIN</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light text-muted">🔑</span>
                            <input type="password" name="pin" maxlength="4" class="form-control" placeholder="Enter 4-Digit PIN" autocomplete="new-password" required>
                        </div>
                        <div class="form-text">Your 4-digit PIN is required to authorize this transfer.</div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Confirm Transfer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
